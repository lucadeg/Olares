
name: Backup Server Build test

on:
  workflow_dispatch:
  # Automatic triggers removed; invoke through FounderOS/Admin Gate.
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-go@v3
      with:
        go-version: '1.21.10'
    - name: Run Build
      working-directory: framework/backup-server
      run: |
        make build
