
name: OSNode-Init Build test

on:
  workflow_dispatch:
  # Automatic triggers removed; invoke through FounderOS/Admin Gate.
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-go@v3
      with:
        go-version: '1.24.6'
    - name: Run Build
      working-directory: framework/osnode-init
      run: |
        make all
