
name: BFL Build test

on:
  workflow_dispatch:
  # Automatic triggers removed; invoke through FounderOS/Admin Gate.
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-go@v3
      with:
        go-version: '1.22.1'
    - name: Run Build
      working-directory: framework/bfl
      run: |
        ksDir="../../kubesphere-ext"
        version="v3.3.0-ext"
        
        if [ -d "$ksDir" ]; then
          pushd "${ksDir}/"
          branch=$(git rev-parse --abbrev-ref HEAD|awk -F / '{print $2}')
          if [ x"$branch" != x"$version" ]; then
            git checkout $version
          fi
          popd &>/dev/null
        else
          git clone https://github.com/beclab/kubesphere-ext.git "${ksDir}"
        fi
        
        make all
